<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hive Office — Tier 1 Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0f0a1a; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
  canvas { image-rendering: pixelated; cursor: pointer; }
  #tooltip {
    position: fixed; display: none;
    background: rgba(30,15,50,0.95); border: 1px solid rgba(124,58,237,0.4);
    border-radius: 10px; padding: 10px 14px; color: #e0d4ff;
    font: 12px 'DM Sans', system-ui, sans-serif; pointer-events: none;
    backdrop-filter: blur(10px); z-index: 10;
  }
  #tooltip .name { font-weight: 700; font-size: 14px; color: #f0ecf9; }
  #tooltip .role { color: #7c6f9b; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
  #tooltip .task { color: #a78bfa; font-size: 11px; margin-top: 6px; }
  #tooltip .status { margin-top: 4px; font-size: 11px; }
  #tooltip .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tooltip">
  <div class="name" id="t-name"></div>
  <div class="role" id="t-role"></div>
  <div class="task" id="t-task"></div>
  <div class="status"><span class="dot" id="t-dot"></span><span id="t-status"></span></div>
</div>

<script>
const TILE = 16;
const SCALE = 2;
const S = TILE * SCALE;
const COLS = 22;
const ROWS = 14;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = COLS * S;
canvas.height = ROWS * S;

// Colors
const C = {
  floor: '#1a1128',
  floorLine: '#201530',
  wall: '#2d1f48',
  wallTop: '#3b2a5e',
  desk: '#2d1f48',
  deskTop: '#3b2a5e',
  monitor: '#0a0a0a',
  monitorScreen: '#1e1b4b',
  keyboard: '#374151',
  chair: '#2d1f48',
  chairBack: '#3b2a5e',
  plant: '#22c55e',
  plantDark: '#16a34a',
  pot: '#5c3317',
  coffee: '#4b5563',
  coffeeTop: '#6b7280',
  rug: '#231838',
  whiteboard: '#e2e8f0',
  whiteboardFrame: '#64748b',
};

// Agents
const agents = [
  { name: 'David', role: 'Engineering', dept: 'R&D', status: 'working', task: 'Fixing auth middleware', skin: '#f5d0a9', hair: '#2c1810', top: '#3b82f6', bottom: '#1e293b', desk: { x: 3, y: 3 } },
  { name: 'Daisy', role: 'Design', dept: 'R&D', status: 'idle', task: '', skin: '#fde0c4', hair: '#c4a35a', top: '#ec4899', bottom: '#7c3aed', desk: { x: 8, y: 3 } },
  { name: 'Drake', role: 'QA', dept: 'R&D', status: 'working', task: 'Running test suite', skin: '#dba97a', hair: '#2c1810', top: '#10b981', bottom: '#1e293b', desk: { x: 13, y: 3 } },
  { name: 'Alex', role: 'Engineering', dept: 'R&D', status: 'waiting', task: 'Waiting for code review', skin: '#c68642', hair: '#2c1810', top: '#f59e0b', bottom: '#1e293b', desk: { x: 3, y: 8 } },
  { name: 'Tracy', role: 'Marketing', dept: 'Non-R&D', status: 'working', task: 'Writing launch blog post', skin: '#fde0c4', hair: '#8b6914', top: '#ef4444', bottom: '#3b82f6', desk: { x: 8, y: 8 } },
  { name: 'Sam', role: 'BA', dept: 'Non-R&D', status: 'idle', task: '', skin: '#f5d0a9', hair: '#4a3728', top: '#7c3aed', bottom: '#1e293b', desk: { x: 13, y: 8 } },
];

// Wandering agents (idle ones walk around)
agents.forEach(a => {
  if (a.status === 'idle' || a.status === 'waiting') {
    a.wanderX = (a.desk.x + 1.5) * S;
    a.wanderY = (a.desk.y + 3) * S;
    a.wanderTarget = null;
    a.wanderTimer = Math.random() * 120;
  }
});

function px(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}

function drawFloor() {
  px(0, 0, COLS * S, ROWS * S, C.floor);
  ctx.strokeStyle = C.floorLine;
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= COLS; i++) { ctx.beginPath(); ctx.moveTo(i * S, 0); ctx.lineTo(i * S, ROWS * S); ctx.stroke(); }
  for (let i = 0; i <= ROWS; i++) { ctx.beginPath(); ctx.moveTo(0, i * S); ctx.lineTo(COLS * S, i * S); ctx.stroke(); }

  // Rug area
  px(2 * S, 2 * S, 16 * S, 11 * S, C.rug);
}

function drawWalls() {
  // Top wall
  px(0, 0, COLS * S, S * 1.5, C.wall);
  px(0, 0, COLS * S, S * 0.3, C.wallTop);
  // Left wall
  px(0, 0, S * 0.3, ROWS * S, C.wall);
  // Right wall
  px((COLS - 0.3) * S, 0, S * 0.3, ROWS * S, C.wall);
  // Bottom wall with door
  px(0, (ROWS - 0.3) * S, COLS * S, S * 0.3, C.wall);
  // Door
  px(10 * S, (ROWS - 0.3) * S, 2 * S, S * 0.3, '#231838');
}

function drawDesk(x, y) {
  const dx = x * S, dy = y * S;
  // Desk surface
  px(dx, dy, 3 * S, 1.8 * S, C.desk);
  px(dx + 2, dy + 2, 3 * S - 4, 1.8 * S - 4, C.deskTop);
  // Monitor
  px(dx + 0.7 * S, dy + 0.15 * S, 1.6 * S, 1 * S, C.monitor);
  px(dx + 0.8 * S, dy + 0.25 * S, 1.4 * S, 0.8 * S, C.monitorScreen);
  // Monitor stand
  px(dx + 1.3 * S, dy + 1.15 * S, 0.4 * S, 0.15 * S, '#4b5563');
  // Keyboard
  px(dx + 0.5 * S, dy + 1.4 * S, 2 * S, 0.35 * S, C.keyboard);
}

function drawChair(x, y) {
  const cx = (x + 1) * S, cy = (y + 2.2) * S;
  // Seat
  px(cx - 0.3 * S, cy + 0.3 * S, 1.6 * S, 0.8 * S, C.chair);
  // Back
  px(cx - 0.2 * S, cy - 0.4 * S, 1.4 * S, 0.25 * S, C.chairBack);
  px(cx - 0.3 * S, cy - 0.4 * S, 0.15 * S, 1.5 * S, C.chair);
  px(cx + 1.15 * S, cy - 0.4 * S, 0.15 * S, 1.5 * S, C.chair);
}

function drawAgent(agent, tick) {
  const atDesk = agent.status === 'working';
  let ax, ay;

  if (atDesk) {
    ax = (agent.desk.x + 1) * S;
    ay = (agent.desk.y + 2.2) * S;
  } else if (agent.wanderX !== undefined) {
    ax = agent.wanderX;
    ay = agent.wanderY;
  } else {
    ax = (agent.desk.x + 1) * S;
    ay = (agent.desk.y + 3.5) * S;
  }

  agent._renderX = ax;
  agent._renderY = ay;

  const s = S * 0.06; // pixel unit

  // Body
  px(ax - 6*s, ay - 8*s, 12*s, 12*s, agent.top);
  // Arms
  const armBob = atDesk ? Math.sin(tick * 0.15) * 1.5 : 0;
  px(ax - 9*s, ay - 5*s + armBob, 3*s, 8*s, agent.skin);
  px(ax + 6*s, ay - 5*s - armBob, 3*s, 8*s, agent.skin);
  // Legs
  if (!atDesk) {
    px(ax - 4*s, ay + 4*s, 3*s, 6*s, agent.bottom);
    px(ax + 1*s, ay + 4*s, 3*s, 6*s, agent.bottom);
    // Shoes
    px(ax - 5*s, ay + 10*s, 4*s, 2*s, '#1e1b4b');
    px(ax + 1*s, ay + 10*s, 4*s, 2*s, '#1e1b4b');
  } else {
    // Seated legs
    px(ax - 4*s, ay + 4*s, 8*s, 4*s, agent.bottom);
  }
  // Head
  px(ax - 7*s, ay - 20*s, 14*s, 12*s, agent.skin);
  // Hair
  px(ax - 8*s, ay - 23*s, 16*s, 6*s, agent.hair);
  px(ax - 8*s, ay - 20*s, 2*s, 4*s, agent.hair);
  px(ax + 6*s, ay - 20*s, 2*s, 4*s, agent.hair);
  // Eyes
  const blink = Math.sin(tick * 0.02) > 0.98;
  if (!blink) {
    px(ax - 4*s, ay - 15*s, 2.5*s, 2.5*s, '#1e1b4b');
    px(ax + 2*s, ay - 15*s, 2.5*s, 2.5*s, '#1e1b4b');
  }
  // Mouth
  px(ax - 1*s, ay - 11*s, 3*s, 1*s, darken(agent.skin, 40));

  // Status dot
  const statusColors = { working: '#4ade80', waiting: '#fbbf24', idle: '#64748b' };
  ctx.beginPath();
  ctx.arc(ax, ay - 28*s, 3, 0, Math.PI * 2);
  ctx.fillStyle = statusColors[agent.status];
  ctx.fill();

  // Name label
  ctx.font = '11px "DM Sans", system-ui, sans-serif';
  ctx.fillStyle = '#c4b5fd';
  ctx.textAlign = 'center';
  ctx.fillText(agent.name, ax, ay - 32*s);

  // Typing dots for working agents
  if (atDesk) {
    const dots = '.'.repeat((Math.floor(tick / 15) % 3) + 1);
    ctx.font = 'bold 10px monospace';
    ctx.fillStyle = '#4ade80';
    ctx.fillText(dots, ax + 1.5 * S, ay - 2*s);

    // Screen glow
    const screenX = (agent.desk.x + 0.8) * S;
    const screenY = (agent.desk.y + 0.25) * S;
    const lines = Math.floor(tick / 8) % 5;
    ctx.fillStyle = '#a78bfa';
    for (let i = 0; i < lines; i++) {
      px(screenX + 4, screenY + 4 + i * 6, S * 0.8 + Math.random() * S * 0.4, 3, '#a78bfa44');
    }
  }

  // Waiting indicator
  if (agent.status === 'waiting') {
    const show = Math.sin(tick * 0.06) > 0.3;
    if (show) {
      ctx.font = 'bold 14px sans-serif';
      ctx.fillStyle = '#fbbf24';
      ctx.fillText('?', ax + 10*s, ay - 20*s);
    }
  }

  // Chat bubble for idle near coffee
  if (agent.status === 'idle' && agent.wanderX > 18 * S) {
    const bubbleW = 60, bubbleH = 20;
    const bx = ax - bubbleW / 2, by = ay - 42*s;
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.roundRect(bx, by, bubbleW, bubbleH, 6);
    ctx.fill();
    ctx.font = '9px sans-serif';
    ctx.fillStyle = '#1e1b4b';
    ctx.fillText('☕ Coffee break', ax, by + 14);
  }
}

function drawPlant(x, y) {
  const px2 = (xx, yy, w, h, c) => px(xx * S, yy * S, w * S, h * S, c);
  px2(x, y, 0.8, 0.6, C.pot);
  px2(x - 0.1, y - 0.7, 1, 0.7, C.plant);
  px2(x + 0.1, y - 1, 0.6, 0.4, C.plantDark);
}

function drawCoffeeMachine(x, y) {
  const px2 = (xx, yy, w, h, c) => px(xx * S, yy * S, w * S, h * S, c);
  // Counter
  px2(x, y, 2, 1.2, C.coffee);
  px2(x + 0.1, y + 0.1, 1.8, 1, C.coffeeTop);
  // Machine
  px2(x + 0.3, y - 0.8, 1.4, 0.8, '#374151');
  px2(x + 0.5, y - 0.6, 1, 0.4, '#ef4444');
  // Cup
  px2(x + 0.7, y + 0.3, 0.4, 0.5, '#f8fafc');
  // Label
  ctx.font = '8px sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.textAlign = 'center';
  ctx.fillText('COFFEE', (x + 1) * S, (y + 1.5) * S);
}

function drawWhiteboard(x, y) {
  const px2 = (xx, yy, w, h, c) => px(xx * S, yy * S, w * S, h * S, c);
  px2(x, y, 3, 2, C.whiteboardFrame);
  px2(x + 0.1, y + 0.1, 2.8, 1.8, C.whiteboard);
  // Content lines
  ctx.fillStyle = '#94a3b8';
  for (let i = 0; i < 4; i++) {
    px((x + 0.3) * S, (y + 0.4 + i * 0.35) * S, (1.5 + Math.random()) * S, 2, '#a78bfa44');
  }
  ctx.font = '8px sans-serif';
  ctx.fillStyle = '#7c3aed';
  ctx.textAlign = 'left';
  ctx.fillText('Sprint Board', (x + 0.3) * S, (y + 0.3) * S);
}

function drawSofa(x, y) {
  const px2 = (xx, yy, w, h, c) => px(xx * S, yy * S, w * S, h * S, c);
  px2(x, y, 3, 1.2, '#4c1d95');
  px2(x + 0.15, y + 0.15, 2.7, 0.9, '#6d28d9');
  // Cushions
  px2(x + 0.3, y + 0.3, 1.1, 0.6, '#7c3aed');
  px2(x + 1.6, y + 0.3, 1.1, 0.6, '#7c3aed');
}

function darken(hex, amount) {
  const r = Math.max(0, parseInt(hex.slice(1, 3), 16) - amount);
  const g = Math.max(0, parseInt(hex.slice(3, 5), 16) - amount);
  const b = Math.max(0, parseInt(hex.slice(5, 7), 16) - amount);
  return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}

// Wandering logic
function updateWanderers(tick) {
  agents.forEach(a => {
    if (a.status === 'working') return;
    if (a.wanderX === undefined) return;

    a.wanderTimer = (a.wanderTimer || 0) - 1;

    if (a.wanderTimer <= 0 && !a.wanderTarget) {
      // Pick random target
      const targets = [
        { x: (19 + Math.random()) * S, y: (2 + Math.random() * 2) * S, label: 'coffee' }, // coffee area
        { x: (a.desk.x + 1 + Math.random() * 2) * S, y: (a.desk.y + 3 + Math.random() * 2) * S, label: 'wander' },
        { x: (18 + Math.random() * 2) * S, y: (9 + Math.random() * 2) * S, label: 'sofa' }, // sofa area
        { x: (7 + Math.random() * 6) * S, y: (1.8 + Math.random()) * S, label: 'whiteboard' },
      ];
      a.wanderTarget = targets[Math.floor(Math.random() * targets.length)];
    }

    if (a.wanderTarget) {
      const dx = a.wanderTarget.x - a.wanderX;
      const dy = a.wanderTarget.y - a.wanderY;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < 3) {
        a.wanderTarget = null;
        a.wanderTimer = 60 + Math.random() * 180; // pause 1-4 sec
      } else {
        const speed = 1.2;
        a.wanderX += (dx / dist) * speed;
        a.wanderY += (dy / dist) * speed;
      }
    }
  });
}

// Tooltip
const tooltip = document.getElementById('tooltip');
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  let found = null;
  for (const a of agents) {
    if (!a._renderX) continue;
    const dx = mx - a._renderX;
    const dy = my - (a._renderY - S * 0.3);
    if (Math.abs(dx) < S * 0.8 && Math.abs(dy) < S * 1.2) {
      found = a;
      break;
    }
  }

  if (found) {
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 15) + 'px';
    tooltip.style.top = (e.clientY - 10) + 'px';
    document.getElementById('t-name').textContent = found.name;
    document.getElementById('t-role').textContent = `${found.dept} · ${found.role}`;
    document.getElementById('t-task').textContent = found.task || 'No active task';
    document.getElementById('t-status').textContent = found.status;
    const dotColors = { working: '#4ade80', waiting: '#fbbf24', idle: '#64748b' };
    document.getElementById('t-dot').style.background = dotColors[found.status];
  } else {
    tooltip.style.display = 'none';
  }
});

// Main render loop
let tick = 0;
function render() {
  tick++;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawFloor();
  drawWalls();

  // Furniture
  drawWhiteboard(7, 1.5);
  drawCoffeeMachine(19, 2);
  drawSofa(18, 9);
  drawPlant(1, 12); drawPlant(1, 1.5); drawPlant(20, 12); drawPlant(20, 1.5);
  drawPlant(17, 6);

  // Department labels
  ctx.font = '9px "DM Sans", system-ui, sans-serif';
  ctx.fillStyle = '#4b3a6b';
  ctx.textAlign = 'left';
  ctx.fillText('R&D WING', 2 * S, 2.5 * S);
  ctx.fillText('OPS WING', 2 * S, 7.5 * S);

  // Desks + Chairs + Agents
  agents.forEach(a => {
    drawDesk(a.desk.x, a.desk.y);
    if (a.status === 'working') drawChair(a.desk.x, a.desk.y);
  });

  updateWanderers(tick);

  // Sort agents by Y for depth ordering
  const sorted = [...agents].sort((a, b) => {
    const ay = a.status === 'working' ? a.desk.y : (a.wanderY || a.desk.y * S) / S;
    const by = b.status === 'working' ? b.desk.y : (b.wanderY || b.desk.y * S) / S;
    return ay - by;
  });
  sorted.forEach(a => drawAgent(a, tick));

  // Title (centered)
  ctx.font = 'bold 12px "DM Sans", system-ui, sans-serif';
  ctx.fillStyle = '#7c3aed';
  ctx.textAlign = 'center';
  ctx.fillText('HIVE OFFICE', (COLS / 2) * S, 0.8 * S);

  // Legend (centered below title)
  ctx.font = '9px sans-serif';
  const legend = [['● Working', '#4ade80'], ['● Waiting', '#fbbf24'], ['● Idle', '#64748b']];
  const legendWidth = 80;
  const legendStart = (COLS * S - legend.length * legendWidth) / 2;
  legend.forEach(([text, color], i) => {
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.fillText(text, legendStart + i * legendWidth + legendWidth / 2, 1.3 * S);
  });

  requestAnimationFrame(render);
}

render();
</script>
</body>
</html>
